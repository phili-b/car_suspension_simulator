[project]
name = "car-suspension"
version = "0.1.0"
description = "Interactive quarter-car suspension explorer: springs, dampers, physics, plots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.0",
    "scipy>=1.14",
    "typer>=0.12",
    "plotly>=5.24",  # only for its bundled plotly.min.js, served to the browser
]

[project.scripts]
suspension = "suspension.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suspension"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
